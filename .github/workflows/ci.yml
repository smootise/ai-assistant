# .github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install flake8 pytest; fi
          pip install -e .

      - name: Lint
        run: >-
          flake8 src tools tests/test_pst_discovery.py tests/test_email_store.py
          tests/test_email_ingestion.py --max-line-length=100

      - name: Test
        run: python -m pytest --maxfail=1 --disable-warnings -q
