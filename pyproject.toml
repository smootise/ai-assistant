[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "python-dotenv",
    "pyyaml",
    "qdrant-client",
]

[project.optional-dependencies]
pst = ["libpff-python==20260926"]

[tool.setuptools.packages.find]
where = ["src"]

